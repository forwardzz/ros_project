navigation_node:
  ros__parameters:
    max_speed: 0.5
    max_angular_speed: 1.0
    goal_tolerance: 0.1
    map_topic: "/map"
    odom_topic: "/odom"
    cmd_vel_topic: "/cmd_vel"
    robot_base_frame: "base_link"
    global_frame: "map"
    use_dynamic_obstacles: true
    obstacle_inflation_radius: 0.3
    local_planner_frequency: 10.0
    global_planner_frequency: 1.0
    recovery_enabled: true
    recovery_behaviors: ["spin", "backup"]
