# Nav2 Autonomous Navigation - Tracked Differential Robot
# RPLIDAR A1 + YB-IMU + EKF odometry

amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_link
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 3.0
    laser_max_range: 12.0
    laser_min_range: 0.15
    laser_model_type: likelihood_field
    max_beams: 120
    max_particles: 3000
    min_particles: 700
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.1
    recovery_alpha_slow: 0.001
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    sigma_hit: 0.12
    tf_broadcast: true
    transform_tolerance: 0.5
    update_min_a: 0.1
    update_min_d: 0.08
    z_hit: 0.75
    z_max: 0.05
    z_rand: 0.2
    z_short: 0.05
    scan_topic: /scan
    set_initial_pose: false
    always_reset_initial_pose: false

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20

# ============================================================
# 控制器服务器
# 跟踪全局路径，结合局部代价地图做实时避障和速度控制
# ============================================================
controller_server:
  ros__parameters:
    use_sim_time: false
    # 控制回路频率（Hz）：每秒调用控制器多少次。20Hz 对慢速小车足够
    controller_frequency: 20.0
    # 低于此线速度（m/s）视为静止
    min_x_velocity_threshold: 0.001
    # 低于此角速度（rad/s）视为不转
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # ----------------------------------------------------------
    # 进度检查器：检测机器人是否卡住
    # 如果在 movement_time_allowance 时间内没有移动 required_movement_radius 距离，
    # 就认为卡住了，触发恢复行为（比如后退、旋转）
    # ----------------------------------------------------------
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    # ----------------------------------------------------------
    # 到达目标检查器
    # xy_goal_tolerance：位置容差（米），距目标在此范围内算到达
    # yaw_goal_tolerance：朝向容差（rad）
    # 履带车目标点附近原地找姿态会产生大电流，任务导航默认忽略最终朝向。
    # ----------------------------------------------------------
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.18
      yaw_goal_tolerance: 6.28

    # ----------------------------------------------------------
    # Regulated Pure Pursuit 控制器
    # 核心控制算法：沿路径前方一定距离（lookahead）做弧线跟踪
    # ----------------------------------------------------------
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # 期望线速度（m/s）：正常跟踪时的目标速度
      desired_linear_vel: 0.15
      # 最大线速度（m/s）：控制器不会超过这个速度
      max_linear_vel: 0.25
      # 最小线速度（m/s）：转弯时会降速，但不会低于这个值
      min_linear_vel: 0.01

      # ----------------------------------------------------------
      # 前视距离（米）：控制器看向路径前方多远处来做转向
      # 值越大 → 转弯越平滑但切弯越严重
      # 值越小 → 跟踪精确但容易振荡
      # 如果小车切弯严重或走 S 形，调小这个值
      # ----------------------------------------------------------
      lookahead_dist: 0.4
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.7
      lookahead_time: 1.5

      # 原地旋转到目标朝向时的角速度（rad/s）
      rotate_to_heading_angular_vel: 0.2
      transform_tolerance: 0.5
      # true = 前视距离随速度缩放（速度越快看得越远）
      use_velocity_scaled_lookahead_dist: false
      # 最大角速度（rad/s）：限制转向速度，防止打滑
      max_angular_vel: 0.45
      # 接近目标时的最小线速度
      min_approach_linear_velocity: 0.05
      # 距目标多远开始减速（米）
      approach_velocity_scaling_dist: 1.0

      # ----------------------------------------------------------
      # 碰撞检测：控制器会在路径前方做预测
      # true = 如果预测到碰撞会减速或停止（更安全但可能太保守）
      # false = 不做碰撞预测，完全依赖代价地图避障
      # 如果机器人频繁"检测到碰撞"停下，可以先设 false 试试
      # ----------------------------------------------------------
      use_collision_detection: true
      # 碰撞预测时间（秒）：向前看多久的轨迹来检测碰撞
      max_allowed_time_to_collision_up_to_carrot: 1.0

      # 代价感知速度缩放：遇到高代价区域自动减速（当前关闭）
      use_regulated_linear_velocity_scaling: false
      # ----------------------------------------------------------
      # 代价代价速度缩放开关
      # true = 当路径经过代价地图的高代价区域时自动减速
      # false = 不因代价而降速（当前关闭，如果开了机器人可能在靠近障碍时走太慢）
      # ----------------------------------------------------------
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.3
      regulated_linear_scaling_min_speed: 0.08

      # ----------------------------------------------------------
      # 到达目标后是否原地旋转到目标朝向
      # true = 到达目标位置后会额外转到指定朝向
      # 如果不需要精确朝向，设 false 可以更快到达
      # ----------------------------------------------------------
      use_rotate_to_heading: true
      # 是否允许倒车（false = 始终正向行驶）
      allow_reversing: false
      # 偏差多少角度才触发原地旋转（rad），约 28.6°
      rotate_to_heading_min_angle: 0.78
      # 加速度限制
      max_angular_accel: 0.7
      max_linear_accel: 0.5

# ============================================================
# 局部代价地图 (Local Costmap)
# 用途：实时避障，跟随机器人移动，范围小但更新快
# 修改建议：
#   - 避障太灵敏 → 调大 inflation_radius 或降低 cost_scaling_factor
#   - 离墙太近撞墙 → 调大 robot_radius 或 inflation_radius
#   - 更新太慢跟不上 → 调大 update_frequency
#   - 小车原地转但不走 → inflation 把前方全部标记为高代价，尝试调大 cost_scaling_factor
# ============================================================
local_costmap:
  local_costmap:
    ros__parameters:
      # 代价地图每秒更新几次（Hz）。越高避障越灵敏，但 CPU 开销越大
      update_frequency: 10.0
      # 代价地图每秒发布几次到 /local_costmap topic（供 RViz 显示用，不影响避障逻辑）
      publish_frequency: 5.0
      # 参考坐标系：odom（局部代价地图固定用 odom，会跟随机器人滚动）
      global_frame: odom
      # 机器人坐标系
      robot_base_frame: base_link
      use_sim_time: false
      # 是否启用滚动窗口模式：true = 只保留机器人周围一块区域，而不是整张地图
      rolling_window: true
      # 滚动窗口宽度（米）。机器人前后左右各 2m 范围内的障碍会被感知
      width: 4
      # 滚动窗口高度（米）
      height: 4
      # 栅格分辨率（米/格）。越小避障越精细，但内存和计算量越大
      resolution: 0.05

      # ----------------------------------------------------------
      # 机器人外接矩形 footprint（米）
      # 用接近实车 20cm x 25cm 的保守矩形，避免圆形半径低估车体角落。
      # ----------------------------------------------------------
      footprint: "[[0.135, 0.11], [0.135, -0.11], [-0.135, -0.11], [-0.135, 0.11]]"

      # ----------------------------------------------------------
      # 膨胀半径（米）—— 障碍物周围的"代价缓冲区"
      # 值越大，机器人离障碍物越远。当前 0.12，给 27cm 车体留出约一个半宽的离墙距离。
      # 0.01 时机器人几乎贴着障碍物走，是 safety_monitor 频繁报碰撞的主因。
      # 调大后若小车不敢走（全红），配合降低 cost_scaling_factor 补偿。
      # ----------------------------------------------------------
      inflation_radius: 0.12

      # ----------------------------------------------------------
      # 代价衰减速率
      # 控制从障碍物边缘到 inflation_radius 之间代价下降的速度。
      # 值越大 → 代价下降越快 → 机器人更敢靠近障碍物
      # 值越小 → 代价下降越慢 → 机器人离障碍物越远
      # 推荐范围：2.0（保守）~ 10.0（激进）
      # 当前 3.0 偏保守，配合 0.12 的 inflation_radius 让车体离墙约一个半宽。
      # 如果调大 inflation_radius 后小车不动，把这个值再调小。
      # ----------------------------------------------------------
      cost_scaling_factor: 3.0

      # 代价地图的插件列表，按顺序加载。先感知障碍，再膨胀
      plugins: ["obstacle_layer", "inflation_layer"]

      # ----------------------------------------------------------
      # 障碍物感知层：把激光雷达 /scan 数据变成代价地图上的障碍
      # ----------------------------------------------------------
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        # 数据源名称（可以有多个，比如再加一个 sonar）
        observation_sources: laser
        laser:
          # 订阅的激光话题
          topic: /scan
          # 高于此高度的点忽略（米）。2D 雷达基本用不到，留默认值即可
          max_obstacle_height: 2.0
          # true = 雷达没看到障碍的地方会"清除"之前的障碍标记（适合单线雷达）
          clearing: true
          # true = 雷达看到障碍时标记到代价地图上
          marking: true
          # 数据类型
          data_type: "LaserScan"
          # 光线追踪最大距离（米）：比这个远的点不做"清除"处理
          raytrace_max_range: 4.0
          # 障碍物标记最大距离（米）：比这个远的扫描点不标记为障碍
          obstacle_max_range: 3.5
          # 光线追踪最小距离（米）：比这个近的点忽略（避免把车体本身当成障碍）
          raytrace_min_range: 0.15
          # 障碍物标记最小距离（米）
          obstacle_min_range: 0.15

      # ----------------------------------------------------------
      # 膨胀层：在障碍物周围产生梯度代价
      # inflation_radius 和 cost_scaling_factor 在上面已配置
      # ----------------------------------------------------------
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true

      # 每次更新是否发送完整代价地图（true = 稳定但带宽大，false = 只发增量）
      always_send_full_costmap: true

# ============================================================
# 全局代价地图 (Global Costmap)
# 用途：全局路径规划，基于整张静态地图，更新慢但覆盖范围大
# 修改建议：
#   - 规划路径穿墙 → 检查 static_layer 是否正常加载地图
#   - 路径离墙太近 → 调大 robot_radius 或 inflation_radius
#   - 规划速度慢 → 降低 resolution 或 update_frequency
#   - 障碍区域没被标记 → static_layer 的地图数据可能过时
# ============================================================
global_costmap:
  global_costmap:
    ros__parameters:
      # 全局代价地图更新频率（Hz）。2Hz 足够，因为地图变化慢
      update_frequency: 2.0
      # 发布频率（Hz），仅供 RViz 显示
      publish_frequency: 1.0
      # 参考坐标系：map（全局固定坐标系）
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      # false = 不使用滚动窗口，整张地图都参与规划
      rolling_window: false

      # ----------------------------------------------------------
      # 全局代价地图分辨率（米/格）
      # 比局部代价地图的 0.05 更粗（0.03 会更精细但更慢）。
      # 调小 → 路径规划更精确但更慢；调大 → 更快但路径可能粗糙。
      # ----------------------------------------------------------
      resolution: 0.05

      # 机器人外接矩形 footprint（米）—— 和局部代价地图保持一致
      footprint: "[[0.135, 0.11], [0.135, -0.11], [-0.135, -0.11], [-0.135, 0.11]]"

      # ----------------------------------------------------------
      # 全局膨胀半径（米）
      # 这个值影响 NavFn 规划器的路径选择。
      # 当前 0.15，略大于局部，让全局规划路径远离墙壁。
      # ----------------------------------------------------------
      inflation_radius: 0.15

      # 代价衰减速率，含义同局部代价地图
      # 8.0 衰减过快，配合大 inflation 时机器人仍贴墙；降到 3.0 让代价梯度更平缓。
      cost_scaling_factor: 3.0

      # 全局代价地图插件：先加载静态地图层，再膨胀
      plugins: ["static_layer", "inflation_layer"]

      # ----------------------------------------------------------
      # 静态地图层：从 /map topic 读取已保存的 pgm/yaml 地图
      # 这是全局代价地图的"底图"，障碍物信息来自建图时的 OccupancyGrid
      # ----------------------------------------------------------
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        # true = 使用 Transient Local QoS 订阅，确保能收到 map_server 发布的地图
        # 如果 UI 重置后看不到地图，检查这个值是否为 true
        map_subscribe_transient_local: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true

      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: false

# ============================================================
# 全局路径规划器
# 使用全局代价地图计算从起点到目标的全局路径
# ============================================================
planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      # NavFn 规划器：基于 Dijkstra/A* 的网格规划器
      plugin: "nav2_navfn_planner::NavfnPlanner"
      # ----------------------------------------------------------
      # 到达容差（米）：目标点周围多少范围内算"到达"
      # 0.5 表示距离目标 0.5m 以内就认为到了。如果机器人总到不了目标，调大这个值。
      # ----------------------------------------------------------
      tolerance: 0.15
      # true = 用 A*（更快），false = 用 Dijkstra（更完整但更慢）
      use_astar: true
      # ----------------------------------------------------------
      # 是否允许路径经过未知区域（地图灰色区域）
      # true = 允许（适合探索），false = 只走已知区域（更安全）
      # 如果机器人经常走到未建图区域卡住，改成 false
      # ----------------------------------------------------------
      allow_unknown: true

# ============================================================
# 恢复行为服务器
# 当机器人卡住或规划失败时执行的恢复动作
# ============================================================
behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    # 恢复行为插件列表
    behavior_plugins: ["backup", "drive_on_heading", "assisted_teleop", "wait"]
    # backup：后退，用于从死胡同退出
    backup:
      plugin: "nav2_behaviors::BackUp"
    # drive_on_heading：朝指定方向前进（或后退）一定距离
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    # assisted_teleop：手动辅助遥控（带碰撞检测）
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    # wait：原地等待
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.5

# ============================================================
# 路径平滑器
# 对规划器输出的全局路径做平滑处理，减少急转弯
# ============================================================
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      # 迭代停止条件：代价变化低于此值时停止平滑
      tolerance: 1.0e-10
      # 最大迭代次数：越大平滑效果越好但越慢
      max_its: 1000
      # true = 平滑后再做一次碰撞校验，不合格则回退原始路径
      do_refinement: true

# ============================================================
# 速度平滑器
# 在控制器输出 (/cmd_vel_nav) 和底盘输入 (/cmd_vel) 之间做平滑
# 防止速度突变导致底盘打滑或硬件损坏
# ============================================================
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    # 平滑处理频率（Hz）
    smoothing_frequency: 20.0
    scale_velocities: false
    # 反馈模式：OPEN_LOOP = 不用实际速度做反馈，CLOSED_LOOP = 用 /odom 反馈
    feedback: "OPEN_LOOP"
    # ----------------------------------------------------------
    # 速度限制：[线速度x, 线速度y, 角速度z]
    # 履带车没有横向移动，y 始终为 0
    # 当前最大前进 0.18 m/s，最大转向 0.55 rad/s
    # ----------------------------------------------------------
    max_velocity: [0.18, 0.0, 0.55]
    min_velocity: [-0.18, 0.0, -0.55]
    # ----------------------------------------------------------
    # 加速度限制：[线加速度x, 线加速度y, 角加速度z]
    # 值越大 → 加速越快（响应灵敏但可能打滑）
    # 值越小 → 加速越慢（更平滑但响应迟钝）
    # 如果小车起步或转向太猛，调小这些值
    # ----------------------------------------------------------
    max_accel: [0.35, 0.0, 0.7]
    # 减速度（负值）：越大 → 刹车越猛
    max_decel: [-0.45, 0.0, -0.9]
    odom_topic: "odom"
    odom_duration: 0.1
    # ----------------------------------------------------------
    # 死区速度：低于此值的速度直接归零，避免小车抖动
    # [线速度x, 线速度y, 角速度z]
    # 当前 0.05 m/s 和 0.05 rad/s 以下视为零
    # 如果小车原地抖动，调大这个值
    # ----------------------------------------------------------
    deadband_velocity: [0.05, 0.0, 0.05]
    # 收不到新速度命令超过此时间（秒）后自动停车
    velocity_timeout: 1.0
