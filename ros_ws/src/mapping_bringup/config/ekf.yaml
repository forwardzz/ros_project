ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.3
    two_d_mode: true
    publish_tf: true

    odom_frame: odom
    map_frame: map
    base_link_frame: base_link
    world_frame: odom

    # rf2o raw laser odometry. EKF owns /odom and odom -> base_link TF.
    odom0: /laser_odom
    odom0_config: [true,  true,  false,
                   false, false, true,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # IMU: fuse yaw rate only for first pass. Do not fuse magnetometer yaw or
    # linear acceleration until mounting direction and drift are field-checked.
    imu0: /imu/data_raw
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 20
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: false
