amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.4
    alpha2: 0.4
    alpha3: 0.4
    alpha4: 0.4
    alpha5: 0.4
    base_frame_id: base_link
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 3.0
    laser_max_range: 8.0
    laser_min_range: 0.15
    laser_model_type: likelihood_field
    max_beams: 60
    max_particles: 1500
    min_particles: 700
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.1
    recovery_alpha_slow: 0.001
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    sigma_hit: 0.12
    tf_broadcast: true
    transform_tolerance: 0.5
    update_min_a: 0.25
    update_min_d: 0.10
    z_hit: 0.75
    z_max: 0.05
    z_rand: 0.2
    z_short: 0.05
    scan_topic: /scan
    set_initial_pose: false
    always_reset_initial_pose: false
    initial_pose.x: 0.0
    initial_pose.y: 0.0
    initial_pose.z: 0.0
    initial_pose.yaw: 0.0

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.01
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 30.0

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::PositionGoalChecker"
      xy_goal_tolerance: 0.15

    FollowPath:
      plugin: "inspection_robot_dwa_controller::DWAController"
      use_dwa: true
      min_vel_x: 0.0
      max_vel_x: 0.14
      max_vel_theta: 0.45
      min_speed_xy: 0.0
      acc_lim_x: 0.35
      acc_lim_theta: 0.90
      decel_lim_x: -0.45
      decel_lim_theta: -1.00
      vx_samples: 8
      vtheta_samples: 21
      sim_time: 2.5
      sim_granularity: 0.05
      angular_sim_granularity: 0.05
      transform_tolerance: 0.5
      prune_distance: 1.0
      max_robot_pose_search_dist: 2.0
      forward_plan_distance: 2.0
      max_local_plan_poses: 60
      debug_timing: true
      timing_warn_ms: 80.0
      path_distance_bias: 18.0
      goal_distance_bias: 6.0
      goal_front_bias: 4.0
      alignment_bias: 12.0
      occdist_scale: 2.5
      twirling_scale: 0.2
      oscillation_scale: 4.0
      prefer_forward_scale: 8.0
      linear_velocity_change_scale: 2.0
      angular_velocity_change_scale: 0.5
      forward_point_distance: 0.25
      path_heading_lookahead: 0.35
      rotate_to_path_engage_angle: 0.60
      rotate_to_path_disengage_angle: 0.25
      obstacle_cost_threshold: 254.0
      allow_unknown: false
      oscillation_reset_dist: 0.08
      oscillation_reset_angle: 0.25
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.25
      rotate_to_goal_heading: false
      rotate_to_goal_angular_vel: 0.35
      trans_stopped_velocity: 0.03
      theta_stopped_velocity: 0.05
      min_approach_vel_x: 0.05
      min_dwa_window_vel_x: 0.05
      approach_slowdown_distance: 0.50

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.03
      transform_tolerance: 0.5
      footprint: "[[0.135, 0.11], [0.135, -0.11], [-0.135, -0.11], [-0.135, 0.11]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: laser
        laser:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 2.5
          obstacle_max_range: 2.5
          raytrace_min_range: 0.15
          obstacle_min_range: 0.15
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.20
        cost_scaling_factor: 5.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      rolling_window: false
      resolution: 0.03
      transform_tolerance: 0.5
      footprint: "[[0.135, 0.11], [0.135, -0.11], [-0.135, -0.11], [-0.135, 0.11]]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: laser
        laser:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          obstacle_max_range: 3.0
          raytrace_min_range: 0.15
          obstacle_min_range: 0.15
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.20
        cost_scaling_factor: 5.0
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.15
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: false
      max_iterations: 100000
      max_on_approach_iterations: 1000
      terminal_checking_interval: 5000
      max_planning_time: 2.0
      cost_travel_multiplier: 1.5
      use_final_approach_orientation: false
      GridBased.smoother.tolerance: 1.0e-10
      GridBased.smoother.max_iterations: 1000
      GridBased.smoother.refinement_num: 2
      GridBased.smoother.w_data: 0.2
      GridBased.smoother.w_smooth: 0.8
      GridBased.smoother.do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    wait:
      plugin: "nav2_behaviors::Wait"
    simulate_ahead_time: 0.8
    max_rotational_vel: 0.50
    min_rotational_vel: 0.08
    rotational_acc_lim: 0.5
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.5

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.14, 0.0, 0.45]
    min_velocity: [-0.14, 0.0, -0.45]
    max_accel: [0.30, 0.0, 0.90]
    max_decel: [-0.40, 0.0, -1.00]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.01, 0.0, 0.02]
    velocity_timeout: 0.5

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200
